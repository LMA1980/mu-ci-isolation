[package]
name = "mu-ci-isolation"
version = "0.1.0"
edition = "2021"
description = "3-layer monotonic privilege attenuation and dual-backend KernelSandbox/HypervisorSandbox engine"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/LMA1980/mu-ci-isolation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
nix = { version = "0.29", features = ["sched", "mount", "process", "resource", "fs", "user"] }

[dev-dependencies]
tempfile = "3"
